name: Bug report
description: Something in a package or an icon is broken
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - standardicon (CLI)
        - "@standardicon/react"
        - "@standardicon/mcp"
        - An icon's drawing
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, and your Node version if it matters.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran or the code you wrote.
    validations:
      required: true
