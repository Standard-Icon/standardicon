# Response headers are picked by path in these maps, so every header is set once at the server level.
# nginx drops all server-level add_header lines in any location that has its own, so no location
# below sets headers. An empty value means the header isn't sent.

# Icons, the index, agent docs, and the package change with each release; Next's files never change.
map $uri $cache_control {
    ~^/_next/static/                                               "public, max-age=31536000, immutable";
    ~^/(svg/|icons\.json|llms|SKILL\.md|standardicon-[^/]*\.tgz)   "public, max-age=3600";
    ~^/splash/api/                                                 "";
    default                                                        "public, max-age=300";
}

# Agents and other sites can fetch icons directly.
map $uri $cors_origin {
    ~^/(svg/|icons\.json|llms|SKILL\.md|standardicon-[^/]*\.tgz)   "*";
    default                                                        "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    error_page 404 /404.html;

    # One canonical host, so search engines don't index the site twice.
    if ($host = www.standardicon.com) {
        return 301 https://standardicon.com$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/markdown application/json application/javascript text/javascript image/svg+xml application/xml;

    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        application/xml xml;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        font/woff2 woff2;
        text/plain txt;
        text/markdown md;
        application/gzip tgz;
    }
    charset utf-8;
    charset_types text/plain text/markdown text/css application/json image/svg+xml application/xml text/javascript;

    add_header Cache-Control $cache_control;
    add_header Access-Control-Allow-Origin $cors_origin;

    # Security headers, on every response including errors.
    # The page needs 'unsafe-inline' scripts: a static export can't use nonces, and Next inlines its page
    # data. m.rgan.co is the visitor metrics script and where it reports. data: and blob: images are the
    # PNG export and downloads. Inline styles come from React style props.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://m.rgan.co; connect-src 'self' https://m.rgan.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(svg/|icons\.json|llms|SKILL\.md|standardicon-[^/]*\.tgz) {
        try_files $uri =404;
    }

    # The drawing page saves through a small Node server in this container. See splash/.
    location /splash/api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # The Node server sends this too; nginx adds its own above.
        proxy_hide_header X-Content-Type-Options;
    }

    # Proves to the MCP Registry that standardicon.com owns the com.standardicon names. It has no extension,
    # so say it's text.
    location = /.well-known/mcp-registry-auth {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
