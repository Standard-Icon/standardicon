# The public site while the full site is on the preview: every page shows the drawing page.

# Every header is set once at the server level and picked by path here, because nginx drops all
# server-level add_header lines in any location that has its own. An empty value isn't sent.
map $uri $cache_control {
    ~^/_next/static/   "public, max-age=31536000, immutable";
    ~^/splash/api/     "";
    /favicon.svg       "";
    default            "public, max-age=60";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    if ($host = www.standardicon.com) {
        return 301 https://standardicon.com$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/json application/javascript text/javascript image/svg+xml;

    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        font/woff2 woff2;
    }
    charset utf-8;

    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control $cache_control;

    # Security headers, the same as the full site's nginx.conf. See the notes there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://m.rgan.co; connect-src 'self' https://m.rgan.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # The icon files and package are offline too, so tools get a clear failure and not a web page.
    location ~ ^/(svg/|icons\.json|llms|SKILL\.md|standardicon-[^/]*\.tgz) {
        return 503;
    }

    location /splash/api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # The Node server sends these too; nginx adds its own above.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Robots-Tag;
    }

    location /_next/static/ {
    }

    location = /favicon.svg {
    }

    # The preview image for links shared before launch.
    location = /og-splash.png {
    }

    # Proves to the MCP Registry that standardicon.com owns the com.standardicon names.
    location = /.well-known/mcp-registry-auth {
        default_type text/plain;
    }

    location / {
        try_files /splash/index.html =404;
    }
}
